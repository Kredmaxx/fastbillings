<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none" role="img" aria-label="Fast Billings">
  <defs>
    <linearGradient id="fbGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#2E8BFF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="fbGrad2" x1="20" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AC8FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <!-- Motion + stylized B as one silhouette -->
  <g fill="url(#fbGrad)">
    <!-- speed bars (left of B stem) -->
    <rect x="0" y="14" width="26" height="11" rx="5.5"/>
    <rect x="8" y="32" width="18" height="11" rx="5.5"/>
    <rect x="0" y="50" width="26" height="11" rx="5.5"/>
    <rect x="10" y="68" width="16" height="11" rx="5.5"/>
    <!-- B outer path -->
    <path d="M28 8c0-4.42 3.58-8 8-8h34c15.46 0 28 10.07 28 25.2 0 8.5-4.8 15.5-12.2 19.7C96.6 49.6 102 57.8 102 68.4 102 84.7 88.2 96 70 96H36c-4.42 0-8-3.58-8-8V8z"/>
  </g>

  <!-- Document cutout -->
  <path fill="#FFFFFF" d="M46 24h24l12 12v40a4 4 0 0 1-4 4H46a4 4 0 0 1-4-4V28a4 4 0 0 1 4-4z"/>
  <path fill="#DCECFF" d="M70 24v12h12L70 24z"/>
  <rect x="50" y="46" width="24" height="3.5" rx="1.75" fill="#0066FF" opacity=".4"/>
  <rect x="50" y="54" width="20" height="3.5" rx="1.75" fill="#0066FF" opacity=".4"/>
  <rect x="50" y="62" width="22" height="3.5" rx="1.75" fill="#0066FF" opacity=".4"/>

  <!-- Verified check badge -->
  <circle cx="88" cy="80" r="15" fill="#22C55E"/>
  <path d="M80 80.5l5 5 11-11" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="122" y="64" font-family="Inter,Segoe UI,system-ui,-apple-system,sans-serif" font-size="44" font-weight="700" letter-spacing="-.8">
    <tspan fill="#000B1E">Fast</tspan>
    <tspan dx="10" fill="#0066FF">Billings</tspan>
  </text>
</svg>
