name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastbillings-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastbillings-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastbillings-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastbillings-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  admin:
    name: Admin lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastbillings-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastbillings-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
